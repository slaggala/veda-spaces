# clamd configuration proposed for the catalog V3 scanner (CATALOG-V3-media-enablement.md §6; media-infrastructure
# §limits). Bind-mounted read-only over /etc/clamav/clamd.conf: the official image's entrypoint can only edit that
# file in place, which a read-only root filesystem forbids. Everything not listed keeps the clamd default.
# Not deployed by anything yet: api/deploy/docker-compose.yml still runs the image's own configuration.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
# The API streams each upload (INSTREAM); the limits sit above the largest allowed upload (images 15 MB; 3D 25 MB,
# disabled) so that a legitimate object is never refused by the scanner and an oversized stream is an error (never CLEAN).
StreamMaxLength 30M
MaxScanSize 100M
MaxFileSize 30M
MaxRecursion 10
# One engine at a time: a signature reload does not double clamd's memory (capacity rule, enablement §4); scans wait
# for the reload instead. The validation run measures both settings.
ConcurrentDatabaseReload no
ExitOnOOM yes
