# Pre-commit hooks for the staging infrastructure only (AUT-001). Application code is untouched: every hook
# is limited to infra/ or the infra workflows. Install: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        files: ^infra/terraform/
      - id: terraform_validate
        files: ^infra/terraform/
        args: ["--hook-config=--retry-once-with-cleanup=true", "--tf-init-args=-backend=false"]
      - id: terraform_tflint
        files: ^infra/terraform/
        args: ["--args=--config=__GIT_WORKING_DIR__/infra/.tflint.hcl"]
      - id: terraform_checkov
        files: ^infra/terraform/
        args: ["--args=--quiet --compact --skip-download"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^infra/scripts/

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/0[0-9]-.*\.ya?ml$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        files: ^infra/
      - id: end-of-file-fixer
        files: ^infra/
      - id: trailing-whitespace
        files: ^infra/
      - id: detect-private-key
        files: ^infra/
