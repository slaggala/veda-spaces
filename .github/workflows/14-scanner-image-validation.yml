# Validate a candidate ClamAV image for the catalog V3 scanner on an arm64 runner (CATALOG-V3-media-enablement.md §6).
# No credentials, no environment, no AWS, no staging: the image is pulled by digest from Docker Hub and run on the
# runner under the certified Compose hardening and under the proposed non-root profile (infra/scanner-validation).
# The job summary and the printed summary.json are the evidence for owner decisions AD-1 and AD-2; nothing is decided
# or deployed here. Manual, or on a push of the harness itself on an activation/* branch.
name: 14-scanner-image-validation
run-name: "14-scanner-image-validation (${{ inputs.image || 'default candidate' }})"

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Candidate image pinned by digest, name:tag@sha256:<64 hex> (deploy.sh form)"
        required: true
        type: string
  push:
    branches: ["activation/**"]
    paths:
      - ".github/workflows/14-scanner-image-validation.yml"
      - "infra/scanner-validation/**"

permissions:
  contents: read

jobs:
  validate:
    name: validate (arm64 runner, no credentials)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      # The LTS candidate (ClamAV 1.4.6, Debian 13 slim, the linux/arm64 manifest of the multi-arch index).
      IMAGE: ${{ inputs.image || 'clamav/clamav:1.4.6-debian13-slim@sha256:fe182632e3f8de585c539fb22d84144dd6a7e2bf7d9470607b86ad8c368d1e3b' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the candidate image
        run: infra/scanner-validation/validate.sh "$IMAGE"
