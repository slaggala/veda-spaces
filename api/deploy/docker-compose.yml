# Single host, single instance (ADR-008, OPS-006). Exactly one api, one worker,
# one scheduler and one Litestream replicator.
services:
  api:
    image: veda-api:${VEDA_IMAGE_TAG:-local}
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: /etc/veda/api.env
    volumes: ["/var/lib/veda:/var/lib/veda"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  worker:
    image: veda-api:${VEDA_IMAGE_TAG:-local}
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: /etc/veda/api.env
    command: ["python", "-m", "veda.cli", "worker"]
    volumes: ["/var/lib/veda:/var/lib/veda"]
    restart: unless-stopped
  scheduler:
    image: veda-api:${VEDA_IMAGE_TAG:-local}
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: /etc/veda/api.env
    command: ["python", "-m", "veda.cli", "scheduler"]
    volumes: ["/var/lib/veda:/var/lib/veda"]
    restart: unless-stopped
  # Cloudflare tunnel (AUT-201): connects out only, host network so the API sees the Docker gateway as its peer
  # (VEDA_TRUSTED_PROXY_CIDRS). Started by deploy.sh only when render-edge.sh rendered its configuration, which
  # requires Cloudflare Access on every request (infra/host/cloudflared.yml).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: ["edge"]
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    env_file:
      - path: /etc/veda/cloudflared/tunnel.env
        required: false
    network_mode: host
    volumes: ["/etc/veda/cloudflared/config.yml:/etc/cloudflared/config.yml:ro"]
    restart: unless-stopped
  litestream:
    image: litestream/litestream:0.3.13@sha256:027eda2a89a86015b9797d2129d4dd447e8953097b4190e1d5a30b73e76d8d58
    command: ["replicate"]
    env_file: /etc/veda/api.env
    volumes: ["/var/lib/veda:/var/lib/veda", "./litestream.yml:/etc/litestream.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]  # replication-lag metrics for the CloudWatch agent only
    restart: unless-stopped
  # Catalog V3 malware scanner (targeted media enablement; docs/implementation/catalog/CATALOG-V3-scanner-implementation.md).
  # Started by deploy.sh step 4c only when the rendered configuration selects VEDA_CATALOG_MEDIA_SCANNER=clamd, which
  # staging-core plans only after the owner's scanner decision (option B, resized host) and with the image pinned by
  # digest; any other image is refused. On the private Compose network only (the API reaches clamd:3310); no host port.
  # Not running today (the configuration says none).
  # Non-root profile, validated on arm64 at this memory limit by infra/scanner-validation (workflow 14): the image's
  # clamav user 1000:1000; the bind-mounted entrypoint, which is the image's /init-unprivileged step for step except
  # that PID 1 exits when clamd exits, so the restart policy applies; every capability dropped and none added; no
  # privileged mode; read-only root; tmpfs with mode 1777 and a size bound for the three directories the daemons write
  # (the default tmpfs mode was not writable by uid 1000); clamd.conf bind-mounted read-only (the image's /init
  # rewrites it from the environment, impossible here); the signature database on a named volume owned 1000:1000.
  clamd:
    image: ${VEDA_CLAMD_IMAGE:-scanner-image-not-decided}
    profiles: ["scanner"]
    expose: ["3310"]
    user: "1000:1000"
    entrypoint: ["/usr/local/bin/veda-clamd-init"]
    environment:
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: "2"  # signature checks per day; the media-signatures-outdated alarm fires at 48 h
    volumes:
      - clamav-db:/var/lib/clamav  # signature database, kept across restarts (freshclam updates it in place)
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
      - ./clamd-entrypoint.sh:/usr/local/bin/veda-clamd-init:ro
    tmpfs:
      - /tmp:mode=1777,size=256m,noexec,nosuid,nodev  # clamd socket and scan temporaries (StreamMaxLength 30M, MaxScanSize 100M)
      - /run/clamav:mode=1777,size=8m,noexec,nosuid,nodev
      - /var/log/clamav:mode=1777,size=64m,noexec,nosuid,nodev  # clamd.log (rotated at 5M) and freshclam.log
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_reservation: ${VEDA_CLAMD_MEM_RESERVATION:-1024m}
    mem_limit: ${VEDA_CLAMD_MEM_LIMIT:-2048m}  # measured first-load peak 1.63 GiB; no growth on reload (ConcurrentDatabaseReload no)
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s  # measured 10 s to PONG with the image's preloaded signatures; the image itself allows 6 minutes
      retries: 3
    restart: unless-stopped

volumes:
  clamav-db: {}

