# clamd configuration of the catalog V3 scanner (CATALOG-V3-media-enablement.md §6; CATALOG-V3-scanner-implementation.md).
# Bind-mounted read-only over /etc/clamav/clamd.conf by docker-compose.yml (service clamd): the official image's /init
# rewrites that file in place from CLAMD_CONF_* variables, which a read-only root filesystem forbids and which the
# non-root entrypoint (clamd-entrypoint.sh) never attempts. Everything not listed keeps the clamd 1.4 default.
# infra/scanner-validation/validate.sh runs this exact file (profiles B and C read it from here).
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 5M
LogRotate yes
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
# No User directive: the container already runs as uid 1000 (Compose user 1000:1000); clamd never starts as root here.
TemporaryDirectory /tmp
# The API streams each upload (INSTREAM); the limits sit above the largest allowed upload (images 15 MB; 3D 25 MB,
# disabled) so that a legitimate object is never refused by the scanner and an oversized stream is an error (never CLEAN).
StreamMaxLength 30M
MaxScanSize 100M
MaxFileSize 30M
MaxRecursion 10
# One engine at a time: a signature reload does not double clamd's memory (capacity rule, enablement §4); scans wait
# for the reload (about 7 s measured) instead. The validation run measures both settings under the configured limit.
ConcurrentDatabaseReload no
# Out of memory is fatal, not a degraded scanner: clamd exits, the entrypoint exits with it, Docker restarts the service
# (restart: unless-stopped) and the restart count reaches the scanner-restarts alarm.
ExitOnOOM yes
