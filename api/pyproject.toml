[project]
name = "veda-api"
version = "0.1.0"
description = "Veda Spaces platform API (P0 foundation)"
requires-python = ">=3.12"

[project.scripts]
veda = "veda.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "pg: requires the PostgreSQL engine",
  "slow: long-running concurrency tests",
]
filterwarnings = ["ignore::DeprecationWarning:flask_limiter.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
